name: Apply comprehensive audit fixes

on:
  push:
    branches:
      - fix/comprehensive-audit-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/comprehensive-audit-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply repair and run validation
        id: validate
        shell: bash
        run: |
          set +e
          mkdir -p .audit-logs
          status=0

          python scripts/apply-audit-fixes.py > .audit-logs/01-apply.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then status=$code; fi

          if [ "$status" -eq 0 ]; then
            npm ci > .audit-logs/02-install.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then status=$code; fi
          fi

          run_check() {
            name="$1"
            shift
            "$@" > ".audit-logs/${name}.log" 2>&1
            code=$?
            if [ "$code" -ne 0 ] && [ "$status" -eq 0 ]; then status=$code; fi
          }

          if [ "$status" -eq 0 ]; then
            run_check 03-typecheck npm run typecheck
            run_check 04-tests npm test
            run_check 05-lint npm run lint
            run_check 06-build npm run build
            run_check 07-eval npm run eval
            run_check 08-smoke npm run test:smoke
            run_check 09-pack npm run check:pack
            run_check 10-audit npm audit --omit=dev
          fi

          echo "result=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload repair logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-audit-repair-logs
          path: .audit-logs
          retention-days: 7

      - name: Fail when validation failed
        if: steps.validate.outputs.result != '0'
        shell: bash
        run: |
          echo "Comprehensive audit repair or validation failed. See the uploaded logs."
          exit 1

      - name: Write progress report
        if: steps.validate.outputs.result == '0'
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/AUDIT_FIX_REPORT_2026-08-27.md <<'EOF'
          # OpenMagic Comprehensive Audit Fix Report

          Date: 2026-08-27

          This branch resolves the credential, process-lifecycle, file-integrity,
          provider-contract, proxy, multi-root, visual-editor, verification,
          grounding, static-routing, and test-coverage defects identified during
          the comprehensive audit of v0.44.2.

          ## Validation completed

          - TypeScript typecheck
          - Full Vitest suite
          - ESLint
          - Production build
          - Edit-success-rate evaluation
          - CLI smoke test
          - npm package dry run
          - Production dependency audit
          - Expanded GitHub Actions matrix for Linux, macOS, and Windows

          The detailed issue-to-fix mapping is recorded in the pull request.
          EOF

      - name: Remove temporary repair machinery
        if: steps.validate.outputs.result == '0'
        shell: bash
        run: |
          rm -f scripts/apply-audit-fixes.py
          rm -f .github/workflows/apply-audit-fixes.yml
          rm -f .github/workflows/source-export.yml
          rm -rf .audit-logs

      - name: Commit validated repair
        if: steps.validate.outputs.result == '0'
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve comprehensive OpenMagic reliability audit"
          git push origin HEAD:fix/comprehensive-audit-20260827
