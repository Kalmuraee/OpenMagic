name: Source Export

on:
  push:
    branches:
      - fix/comprehensive-audit-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Archive source
        run: tar --exclude=.git -czf ../openmagic-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: openmagic-source
          path: ../openmagic-source.tgz
          retention-days: 1
