name: Source Snapshot

on:
  push:
    branches:
      - fix/full-audit-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Archive dependencies
        run: tar -czf /tmp/openmagic-node-modules.tgz node_modules
      - name: Upload dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: openmagic-node-modules
          path: /tmp/openmagic-node-modules.tgz
          retention-days: 1
